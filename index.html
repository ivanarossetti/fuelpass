<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuelPass — Gestione Buoni Carburante e Servizi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #003DA5 0%, #0052d4 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-container { background: white; border-radius: 12px; padding: 40px; width: 90%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
h1 { color: #003DA5; margin-bottom: 30px; text-align: center; }
.role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.role-btn { padding: 10px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; transition: all 0.2s; }
.role-btn.active { background: #003DA5; color: white; border-color: #003DA5; }
input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
button { width: 100%; padding: 12px; margin-top: 20px; background: #003DA5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
button:hover { background: #002590; }
.message { padding: 12px; margin: 10px 0; border-radius: 8px; text-align: center; }
.success { background: #D1FAE5; color: #065F46; }
.error { background: #FEE2E2; color: #991B1B; }
</style>
</head>
<body>
<div class="login-container">
<h1>🔴 FuelPass — MANUTENÇÃO</h1>
<div class="message error">⚠️ Sistema em manutenção urgente</div>
<p style="text-align: center; color: #6B7280; margin: 20px 0; font-size: 14px;">
Claude está a corrigir o ficheiro. Por favor, aguarde alguns minutos e recarregue a página.
</p>
<button onclick="location.reload()">🔄 Recarregar</button>
<p style="text-align: center; color: #9CA3AF; font-size: 12px; margin-top: 30px;">
Se o problema persistir, contacte: claude@anthropic.com
</p>
</div>
<script>
// Auto-reload a cada 10 segundos
setTimeout(() => location.reload(), 10000);
</script>
</body>
</html>
